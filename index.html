<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Laura & Panda — interaktivní příběh</title>
    <link rel="stylesheet" href="./laura.css" />
  </head>

  <body>
    <main class="app">
      <header class="top-row">
        <button id="back-btn" class="btn" type="button" disabled aria-label="Zpět">←</button>

        <div class="icon-pill" aria-hidden="true">🐼</div>

        <div class="brand">
          <p class="subtitle">Interaktivní příběh</p>
          <h1 id="scene-title" class="title"></h1>
        </div>

        <div class="actions">
          <button id="restart-btn" class="btn restart" type="button" aria-label="Restart">↻</button>
        </div>
      </header>

      <section class="content">
        <div class="card" aria-live="polite">
          <p id="scene-text"></p>
          <div id="scene-task" class="task-box" style="display:none;"></div>
        </div>

        <section id="choices" class="choices" aria-label="Volby"></section>
      </section>
    </main>

    <!-- Restart confirm modal -->
    <div id="restart-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="restart-title">
      <div class="modal">
        <header>
          <div class="modal-icon" aria-hidden="true">🐼</div>
          <h2 id="restart-title">opravdu chceš odejít</h2>
        </header>
        <div class="body">
          Tímhle se příběh vrátí na začátek. Historie se smaže.
        </div>
        <div class="actions">
          <button id="restart-cancel" class="btn btn-safe" type="button">ne, chci zůstat</button>
          <button id="restart-confirm" class="btn btn-danger" type="button">ano, chci odejít</button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
